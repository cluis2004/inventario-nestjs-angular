<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-box">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
      </div>
      <h1>Inventario Control</h1>
      <p>Inicia sesión para gestionar el stock</p>
    </div>

    <div class="login-body">
      <div *ngIf="error()" class="alert alert-danger">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="alert-icon">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ error() }}</span>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <div class="input-wrapper">
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            (keydown)="onKeyEnter($event)"
            placeholder="ejemplo@correo.com"
            [disabled]="loading()"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            (keydown)="onKeyEnter($event)"
            placeholder="••••••••"
            [disabled]="loading()"
            required
          />
        </div>
      </div>

      <button (click)="login()" class="btn btn-primary" [disabled]="loading()">
        <span *ngIf="!loading()">Ingresar al Sistema</span>
        <span *ngIf="loading()" class="spinner-text">
          <span class="spinner"></span> Procesando...
        </span>
      </button>
    </div>
  </div>
</div>
