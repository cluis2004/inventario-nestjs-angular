<div class="mb-8 flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
  <div>
    <h2 class="m-0 text-2xl font-bold text-slate-900">Registrar Entrada</h2>
  </div>
  <a
    routerLink="/entradas"
    class="inline-flex items-center gap-2 bg-slate-200 px-5 py-2.5 font-medium text-slate-700 transition hover:bg-slate-300"
  >
    <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    <span>Ver Entradas</span>
  </a>
</div>

  <div class="mb-6">
    <label class="mb-2 block text-sm font-semibold text-slate-700">Buscar producto</label>
    <div class="relative">
      <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input
        #productSearchInput
        class="w-full border border-slate-200 py-3 pl-10 pr-3 text-slate-900 outline-none transition focus:border-emerald-500"
        [ngModel]="searchTerm"
        (ngModelChange)="onSearchChange($event)"
        placeholder="Buscar por nombre, ID o código"
        maxlength="80"
      />
    </div>
  </div>

  <div *ngIf="loading()" class="py-16 text-center">
    <div class="mx-auto h-9 w-9 animate-spin border-4 border-slate-100 border-t-emerald-600"></div>
    <p class="mt-3 text-slate-500">Cargando productos...</p>
  </div>

  <div *ngIf="!loading() && searchTerm && hasSearchResults()" class="mb-6 space-y-2 border border-slate-200 bg-white p-3">
    <button
      *ngFor="let product of getFilteredProducts(); trackBy: trackByProduct"
      type="button"
      class="flex w-full items-center justify-between px-4 py-3 text-left transition hover:bg-emerald-50"
      (click)="addProduct(product)"
    >
      <span class="min-w-0">
        <strong class="block truncate text-sm text-slate-900">{{ product.name }}</strong>
        <span class="block truncate text-xs text-slate-500">{{ getProductLabel(product) }}</span>
      </span>
      <span class="text-xs font-medium text-slate-500">Stock: {{ product.stock }}</span>
    </button>
  </div>

  <div *ngIf="!loading() && searchTerm && !hasSearchResults()" class="mb-6 border border-dashed border-slate-300 px-5 py-4 text-sm text-slate-500">
    No se encontraron productos con esa búsqueda.
  </div>

  <div *ngIf="!loading()" class="overflow-x-auto border border-slate-200">
    <table class="min-w-full border-collapse">
      <thead class="bg-slate-50">
        <tr>
          <th class="border-b border-slate-200 px-4 py-3 text-left text-sm font-semibold text-slate-700">Fila</th>
          <th class="border-b border-slate-200 px-4 py-3 text-left text-sm font-semibold text-slate-700">Producto</th>
          <th class="border-b border-slate-200 px-4 py-3 text-center text-sm font-semibold text-slate-700">Stock actual</th>
          <th class="border-b border-slate-200 px-4 py-3 text-center text-sm font-semibold text-slate-700">Cantidad ingreso</th>
          <th class="border-b border-slate-200 px-4 py-3 text-center text-sm font-semibold text-slate-700">Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let detail of details; let i = index; trackBy: trackByRow" class="odd:bg-white even:bg-slate-50/40">
          <td class="border-b border-slate-100 px-4 py-3 text-sm text-slate-600">{{ i + 1 }}</td>
          <td class="border-b border-slate-100 px-4 py-3 text-sm text-slate-700">
            <strong class="block">{{ detail.product_name }}</strong>
            <span class="block text-xs text-slate-500">{{ detail.product_id }}<span *ngIf="detail.product_sku"> - {{ detail.product_sku }}</span></span>
          </td>
          <td class="border-b border-slate-100 px-4 py-3 text-center text-sm font-medium text-slate-700">
            {{ detail.stock }}
          </td>
          <td class="border-b border-slate-100 px-4 py-3">
            <input
              #quantityInput
              class="w-full min-w-[140px] border border-slate-200 px-3 py-2.5 text-center outline-none transition focus:border-emerald-500"
              type="number"
              min="1"
              max="999999"
              step="1"
              inputmode="numeric"
              [ngModel]="detail.quantity"
              (ngModelChange)="updateRowQuantity(i, $event)"
            />
          </td>
          <td class="border-b border-slate-100 px-4 py-3 text-center">
            <button class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-red-600 transition hover:bg-red-50" (click)="clearRow(i)">
              <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
              <span>Limpiar</span>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

<div class="mt-6 flex justify-end">
  <button
    class="inline-flex items-center justify-center gap-2 bg-emerald-600 px-5 py-2.5 font-semibold text-white transition hover:bg-emerald-700 disabled:cursor-not-allowed disabled:bg-emerald-300"
    (click)="saveEntry()"
    [disabled]="saving() || details.length === 0"
  >
    <svg *ngIf="!saving()" class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><path d="M17 21v-8H7v8"></path><path d="M7 3v5h8"></path></svg>
    <span *ngIf="saving()" class="h-4 w-4 animate-spin border-2 border-white/40 border-t-white"></span>
    <span>{{ saving() ? 'Guardando...' : 'Guardar Entrada' }}</span>
  </button>
</div>
