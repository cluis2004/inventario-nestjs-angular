<div class="w-full border border-slate-200 bg-white p-8 text-center shadow-sm sm:p-12">
  <div class="mx-auto flex h-20 w-20 items-center justify-center border border-emerald-200 bg-emerald-100 text-emerald-600">
    <svg class="h-10 w-10" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
  </div>

  <h2 class="mt-6 text-3xl font-bold text-slate-900">Venta registrada con éxito</h2>
  <p class="mt-3 text-slate-500">La operación quedó guardada correctamente en el sistema.</p>

  <div class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-3">
    <div class="border border-slate-200 bg-slate-50 px-5 py-4">
      <p class="text-sm text-slate-500">Nro. venta</p>
      <strong class="mt-2 block text-xl text-slate-900">{{ saleId() ? ('#' + saleId()) : 'Generada' }}</strong>
    </div>
    <div class="border border-slate-200 bg-slate-50 px-5 py-4">
      <p class="text-sm text-slate-500">Unidades</p>
      <strong class="mt-2 block text-xl text-slate-900">{{ items() }}</strong>
    </div>
    <div class="border border-slate-200 bg-slate-50 px-5 py-4">
      <p class="text-sm text-slate-500">Total</p>
      <strong class="mt-2 block text-xl text-slate-900">{{ formatBs(total()) }}</strong>
    </div>
  </div>

  <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
    <a
      routerLink="/ventas"
      class="inline-flex items-center justify-center gap-2 bg-slate-200 px-5 py-3 font-medium text-slate-700 transition hover:bg-slate-300"
    >
      <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
      <span>Volver al listado</span>
    </a>
    <a
      routerLink="/ventas/registrar"
      class="inline-flex items-center justify-center gap-2 bg-emerald-600 px-5 py-3 font-semibold text-white transition hover:bg-emerald-700"
    >
      <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
      <span>Nueva venta</span>
    </a>
  </div>
</div>
