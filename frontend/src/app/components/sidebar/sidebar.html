<aside class="box-border w-full shrink-0 border-b border-slate-200 bg-white lg:sticky lg:top-0 lg:h-screen lg:w-[280px] lg:border-r lg:border-b-0 lg:px-4 lg:py-6">
  <div class="flex items-start justify-between gap-4 px-4 py-4 lg:px-2 lg:py-0">
    <div class="min-w-0">
      <div>
        <p class="m-0 truncate text-sm font-semibold text-slate-800">{{ userName }}</p>
        <p class="m-0 truncate text-xs text-slate-500">{{ userEmail }}</p>
      </div>
    </div>

    <button
      (click)="logout()"
      class="inline-flex shrink-0 items-center justify-center gap-2 bg-slate-100 px-3 py-2 text-sm font-semibold text-slate-600 transition hover:bg-red-50 hover:text-red-600 lg:px-4"
      aria-label="Cerrar sesión"
      title="Cerrar sesión"
    >
      <svg class="h-[18px] w-[18px]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span class="hidden sm:inline">Salir</span>
    </button>
  </div>

  <ul class="m-0 flex list-none gap-2 overflow-x-auto px-3 py-3 lg:flex-col lg:overflow-visible lg:px-0 lg:py-6">
    <li>
      <a
        routerLink="/inicio"
        routerLinkActive="bg-green-50 text-emerald-600 border-l-emerald-600"
        class="flex min-w-max items-center gap-4 border-l-4 border-transparent px-4 py-3 text-[15px] font-semibold text-slate-500 transition hover:bg-slate-50 hover:text-slate-900 lg:px-7 lg:py-3.5"
      >
        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Inicio</span>
      </a>
    </li>
    <li>
      <a
        routerLink="/productos"
        routerLinkActive="bg-green-50 text-emerald-600 border-l-emerald-600"
        class="flex min-w-max items-center gap-4 border-l-4 border-transparent px-4 py-3 text-[15px] font-semibold text-slate-500 transition hover:bg-slate-50 hover:text-slate-900 lg:px-7 lg:py-3.5"
      >
        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
        <span>Productos</span>
      </a>
    </li>
    <li>
      <a
        routerLink="/ventas"
        routerLinkActive="bg-green-50 text-emerald-600 border-l-emerald-600"
        class="flex min-w-max items-center gap-4 border-l-4 border-transparent px-4 py-3 text-[15px] font-semibold text-slate-500 transition hover:bg-slate-50 hover:text-slate-900 lg:px-7 lg:py-3.5"
      >
        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2l3 6h9l-3 6H6l3-6-3-6z"></path><path d="M6 14h12"></path><path d="M9 22a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"></path><path d="M18 22a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"></path></svg>
        <span>Ventas</span>
      </a>
    </li>
    <li>
      <a
        routerLink="/entradas"
        routerLinkActive="bg-green-50 text-emerald-600 border-l-emerald-600"
        class="flex min-w-max items-center gap-4 border-l-4 border-transparent px-4 py-3 text-[15px] font-semibold text-slate-500 transition hover:bg-slate-50 hover:text-slate-900 lg:px-7 lg:py-3.5"
      >
        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="m17 8-5-5-5 5"></path><path d="M5 21h14"></path></svg>
        <span>Entradas</span>
      </a>
    </li>
  </ul>
</aside>
